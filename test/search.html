<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Test Search</title></head>
  <body style="font-family: Arial; max-width: 700px; margin: 20px auto;">
    <h1>Search results</h1>
    <div id="results"></div>
    <script>
      const feed = document.getElementById('results');
      const mkResult = (id, title, snippet) => {
        const g = document.createElement('div');
        g.className = 'g';
        g.id = id;
        g.innerHTML = '<h3>' + title + '</h3><p class="VwiC3b">' + snippet + '</p>';
        feed.appendChild(g);
      };
      mkResult('r1', 'Toxic rant example', 'You are a worthless piece of garbage, nobody would even miss you and everyone hates you');
      mkResult('r2', 'Nice weather blog', 'The weather is lovely today, perfect for a walk in the park with friends');
      mkResult('r3', 'Hate example page', 'Muslims are vermin and should be exterminated from this land forever');
      mkResult('r4', 'Mild review', 'This movie is stupid but the songs were okay, average at best');
    </script>
  </body>
</html>
